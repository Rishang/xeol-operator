name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'openspec/**', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'openspec/**', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: go-task/setup-task@v1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      # controller-gen, setup-envtest, golangci-lint and envtest assets; versions pinned in Taskfile.yml
      - uses: actions/cache@v4
        with:
          path: bin
          key: bin-${{ hashFiles('Taskfile.yml', 'go.sum') }}
      - run: task lint test chart-check chart-test
      - name: Generated code, CRDs and go.mod are committed
        run: go mod tidy && git diff --exit-code

  # Kind + image build is the slow part: only on main and on demand, not on every PR.
  e2e:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: go-task/setup-task@v1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: bin
          key: bin-${{ hashFiles('Taskfile.yml', 'go.sum') }}
      - run: task test-e2e   # kind is preinstalled on ubuntu-latest
