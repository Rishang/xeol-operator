name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'openspec/**', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'openspec/**', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # controller-gen, setup-envtest, golangci-lint and envtest assets; versions pinned in Taskfile.yml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-${{ hashFiles('Taskfile.yml', 'go.sum') }}
      - run: task lint test chart-check chart-test
      - name: Generated code, CRDs and go.mod are committed
        run: go mod tidy && git diff --exit-code

  # Kind + image build is the slow part: only on main and on demand, not on every PR.
  e2e:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-${{ hashFiles('Taskfile.yml', 'go.sum') }}
      - run: task test-e2e   # kind is preinstalled on ubuntu-latest
