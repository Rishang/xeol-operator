<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">xeol-operator architecture</title>
  <desc id="desc">The operator watches the XeolScanner CR and Pods, records running image digests in an in-memory Inventory backed by SQLite, scans each digest with syft and xeol against an EOL database built from endoflife.date, and serves the results as Prometheus metrics, a JSON API, a web UI and MCP tools.</desc>
  <style>
    .bg{fill:#ffffff}
    .grp{fill:#f4f6f9;stroke:#c9d0da}
    .k8s{fill:#dbe8fb;stroke:#4a7fd6}
    .code{fill:#eef0f3;stroke:#8792a2}
    .sub{fill:#e6dcf8;stroke:#7a52c7}
    .store{fill:#d8f0de;stroke:#3f9a5a}
    .ext{fill:#fdecc8;stroke:#d19a1f}
    .box{stroke-width:1.6}
    .h{font-size:13px;font-weight:650;fill:#1b2430}
    .s{font-size:11.5px;fill:#4b5563}
    .g{font-size:14px;font-weight:700;fill:#1b2430}
    .gs{font-size:11.5px;fill:#5b6675}
    .lbl{font-size:11px;fill:#5b6675}
    .ln{stroke:#5b6675;stroke-width:1.5;fill:none}
    .num{fill:#b7471f}
    .numt{font-size:11px;font-weight:700;fill:#ffffff}
    .tt{font-size:20px;font-weight:700;fill:#1b2430}
    #ah path{fill:#5b6675}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .grp{fill:#161b22;stroke:#30363d}
      .k8s{fill:#1d3556;stroke:#5b8fe0}
      .code{fill:#21262d;stroke:#7b8798}
      .sub{fill:#34285a;stroke:#9a77e0}
      .store{fill:#1b3d27;stroke:#52b070}
      .ext{fill:#4a3a14;stroke:#d9a935}
      .h,.g,.tt{fill:#e6edf3}
      .s,.gs,.lbl{fill:#9ba7b4}
      .ln{stroke:#9ba7b4}
      #ah path{fill:#9ba7b4}
      .num{fill:#f08a5f}
      .numt{fill:#0d1117}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="900"/>
  <text class="tt" x="16" y="34">xeol-operator architecture</text>

  <!-- groups -->
  <rect class="grp" x="16" y="56" width="232" height="820" rx="12"/>
  <text class="g" x="32" y="82">Kubernetes API</text>
  <rect class="grp" x="268" y="56" width="664" height="820" rx="12"/>
  <text class="g" x="288" y="82">xeol-operator pod</text>
  <text class="gs" x="430" y="82">controllers and the scan queue run on the leader</text>
  <rect class="grp" x="952" y="56" width="312" height="820" rx="12"/>
  <text class="g" x="972" y="82">Outside the operator</text>

  <!-- Kubernetes API -->
  <rect class="box k8s" x="32" y="100" width="200" height="60" rx="8"/>
  <text class="h" x="44" y="124">XeolScanner/default</text>
  <text class="s" x="44" y="143">scope, interval, ignore rules</text>
  <rect class="box k8s" x="32" y="200" width="200" height="60" rx="8"/>
  <text class="h" x="44" y="224">Pods</text>
  <text class="s" x="44" y="243">containerStatuses[].imageID</text>
  <rect class="box k8s" x="32" y="280" width="200" height="60" rx="8"/>
  <text class="h" x="44" y="304">Workload owners</text>
  <text class="s" x="44" y="323">RS → Deployment, Job → CronJob</text>
  <rect class="box k8s" x="32" y="360" width="200" height="60" rx="8"/>
  <text class="h" x="44" y="384">Namespaces, Nodes,</text>
  <text class="h" x="44" y="402">ServiceAccounts</text>
  <rect class="box k8s" x="32" y="500" width="200" height="60" rx="8"/>
  <text class="h" x="44" y="524">Secrets</text>
  <text class="s" x="44" y="543">image pull secrets, get per scan</text>

  <!-- operator: config -->
  <rect class="box code" x="288" y="100" width="210" height="60" rx="8"/>
  <text class="h" x="300" y="124">XeolScanner reconciler</text>
  <text class="s" x="300" y="143">spec → Config, writes status</text>
  <rect class="box code" x="548" y="100" width="200" height="60" rx="8"/>
  <text class="h" x="560" y="124">Config</text>
  <text class="s" x="560" y="143">live snapshot of the spec</text>

  <!-- operator: discovery and state -->
  <rect class="box code" x="288" y="200" width="210" height="140" rx="8"/>
  <text class="h" x="300" y="224">Pod controller</text>
  <text class="s" x="300" y="246">namespace, kind, image filters</text>
  <text class="s" x="300" y="266">owner walk to the top workload</text>
  <text class="s" x="300" y="286">imageID → repo@digest</text>
  <text class="s" x="300" y="306">node platform, pull secrets</text>
  <rect class="box store" x="548" y="200" width="200" height="80" rx="8"/>
  <text class="h" x="560" y="224">Inventory (memory)</text>
  <text class="s" x="560" y="244">digest → workloads,</text>
  <text class="s" x="560" y="262">findings, next scan time</text>
  <rect class="box store" x="778" y="200" width="134" height="80" rx="8"/>
  <text class="h" x="790" y="224">results.db</text>
  <text class="s" x="790" y="244">SQLite, /var/lib/</text>
  <text class="s" x="790" y="262">xeol-operator/</text>
  <rect class="box code" x="548" y="330" width="200" height="80" rx="8"/>
  <text class="h" x="560" y="354">Scan queue</text>
  <text class="s" x="560" y="374">workqueue keyed by digest</text>
  <text class="s" x="560" y="392">--scan-workers workers</text>

  <!-- operator: scan -->
  <rect class="grp" x="288" y="450" width="624" height="150" rx="10"/>
  <text class="h" x="304" y="472">Scan, one digest per worker</text>
  <rect class="box code" x="304" y="486" width="180" height="96" rx="8"/>
  <text class="h" x="316" y="508">Per-scan temp dir</text>
  <text class="s" x="316" y="528">config.json from pull</text>
  <text class="s" x="316" y="546">secrets, HOME, TMPDIR;</text>
  <text class="s" x="316" y="564">in-flight marker</text>
  <rect class="box sub" x="508" y="486" width="180" height="96" rx="8"/>
  <text class="h" x="520" y="508">syft</text>
  <text class="s" x="520" y="528">scan registry:</text>
  <text class="s" x="520" y="546">repo@digest</text>
  <text class="s" x="520" y="564">→ sbom.json</text>
  <rect class="box sub" x="712" y="486" width="184" height="96" rx="8"/>
  <text class="h" x="724" y="508">xeol</text>
  <text class="s" x="724" y="528">sbom:sbom.json</text>
  <text class="s" x="724" y="546">-o json -l 10y</text>
  <text class="s" x="724" y="564">→ findings</text>

  <!-- operator: db -->
  <rect class="box code" x="508" y="630" width="180" height="60" rx="8"/>
  <text class="h" x="520" y="654">EOL DB manager</text>
  <text class="s" x="520" y="673">daily build, readiness gate</text>
  <rect class="box store" x="712" y="630" width="184" height="60" rx="8"/>
  <text class="h" x="724" y="654">xeol.db</text>
  <text class="s" x="724" y="673">/var/cache/xeol/1/xeol.db</text>

  <!-- operator: http -->
  <rect class="grp" x="288" y="730" width="624" height="126" rx="10"/>
  <text class="h" x="304" y="752">Metrics port: one HTTP server, reads Inventory + Config per request</text>
  <rect class="box code" x="304" y="766" width="140" height="74" rx="8"/>
  <text class="h" x="316" y="792">/metrics</text>
  <text class="s" x="316" y="812">Collector</text>
  <rect class="box code" x="458" y="766" width="140" height="74" rx="8"/>
  <text class="h" x="470" y="792">/api/v1/*</text>
  <text class="s" x="470" y="812">JSON API</text>
  <rect class="box code" x="612" y="766" width="140" height="74" rx="8"/>
  <text class="h" x="624" y="792">/ and /ui/report</text>
  <text class="s" x="624" y="812">web UI (opt-in)</text>
  <rect class="box code" x="766" y="766" width="130" height="74" rx="8"/>
  <text class="h" x="778" y="792">/mcp</text>
  <text class="s" x="778" y="812">MCP tools (opt-in)</text>

  <!-- outside -->
  <rect class="box ext" x="972" y="490" width="272" height="60" rx="8"/>
  <text class="h" x="984" y="514">Container registries</text>
  <text class="s" x="984" y="533">image manifests and layers</text>
  <rect class="box ext" x="972" y="630" width="272" height="60" rx="8"/>
  <text class="h" x="984" y="654">endoflife.date</text>
  <text class="s" x="984" y="673">/api/v1/products/full</text>
  <rect class="box ext" x="972" y="716" width="272" height="44" rx="8"/>
  <text class="h" x="984" y="743">Prometheus + alert rules</text>
  <rect class="box ext" x="972" y="768" width="272" height="44" rx="8"/>
  <text class="h" x="984" y="795">Grafana (Infinity datasource)</text>
  <rect class="box ext" x="972" y="820" width="272" height="44" rx="8"/>
  <text class="h" x="984" y="847">Browser, AI assistant</text>

  <!-- legend -->
  <text class="h" x="972" y="116">Legend</text>
  <rect class="box k8s" x="972" y="128" width="18" height="14" rx="3"/><text class="s" x="998" y="140">Kubernetes object</text>
  <rect class="box code" x="972" y="152" width="18" height="14" rx="3"/><text class="s" x="998" y="164">Code in the operator process</text>
  <rect class="box sub" x="972" y="176" width="18" height="14" rx="3"/><text class="s" x="998" y="188">Subprocess (bundled binary)</text>
  <rect class="box store" x="972" y="200" width="18" height="14" rx="3"/><text class="s" x="998" y="212">State</text>
  <rect class="box ext" x="972" y="224" width="18" height="14" rx="3"/><text class="s" x="998" y="236">External system</text>
  <circle class="num" cx="981" cy="262" r="9"/><text class="numt" x="981" y="266" text-anchor="middle">1</text><text class="s" x="998" y="266">Step in docs/architecture.md</text>

  <!-- arrows -->
  <path class="ln" d="M232 122 H288" marker-end="url(#ah)"/>
  <path class="ln" d="M288 146 H232" marker-end="url(#ah)"/>
  <text class="lbl" x="236" y="174">status</text>
  <path class="ln" d="M498 130 H548" marker-end="url(#ah)"/>
  <path class="ln" d="M600 160 V180 H420 V200" marker-end="url(#ah)"/>
  <text class="lbl" x="430" y="176">changed: re-check every Pod</text>
  <path class="ln" d="M232 230 H288" marker-end="url(#ah)"/>
  <path class="ln" d="M232 310 H288" marker-end="url(#ah)"/>
  <path class="ln" d="M232 390 H262 V330 H288" marker-end="url(#ah)"/>
  <path class="ln" d="M498 240 H548" marker-end="url(#ah)"/>
  <path class="ln" d="M748 240 H778" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="ln" d="M470 340 V370 H548" marker-end="url(#ah)"/>
  <text class="lbl" x="376" y="388">new digest, not current</text>
  <path class="ln" d="M648 280 V330" marker-end="url(#ah)"/>
  <text class="lbl" x="656" y="304">due, every checkInterval</text>
  <path class="ln" d="M700 410 V450" marker-end="url(#ah)"/>
  <path class="ln" d="M232 530 H304" marker-end="url(#ah)"/>
  <path class="ln" d="M484 534 H508" marker-end="url(#ah)"/>
  <path class="ln" d="M688 534 H712" marker-end="url(#ah)"/>
  <path class="ln" d="M912 520 H972" marker-end="url(#ah)"/>
  <text class="lbl" x="918" y="512">pull</text>
  <path class="ln" d="M804 486 V430 H762 V270 H748" marker-end="url(#ah)"/>
  <text class="lbl" x="814" y="446">findings, next scan time</text>
  <path class="ln" d="M688 660 H712" marker-end="url(#ah)"/>
  <path class="ln" d="M804 630 V582" marker-end="url(#ah)"/>
  <path class="ln" d="M598 690 V710 H950 V660 H972" marker-end="url(#ah)"/>
  <text class="lbl" x="760" y="706">fetch daily</text>
  <path class="ln" d="M972 738 H912" marker-end="url(#ah)"/>
  <text class="lbl" x="918" y="732">scrape</text>
  <path class="ln" d="M972 790 H912" marker-end="url(#ah)"/>
  <text class="lbl" x="918" y="784">query</text>
  <path class="ln" d="M972 842 H912" marker-end="url(#ah)"/>
  <text class="lbl" x="918" y="836">HTTP</text>

  <!-- step numbers -->
  <circle class="num" cx="260" cy="110" r="9"/><text class="numt" x="260" y="114" text-anchor="middle">1</text>
  <circle class="num" cx="260" cy="218" r="9"/><text class="numt" x="260" y="222" text-anchor="middle">2</text>
  <circle class="num" cx="523" cy="228" r="9"/><text class="numt" x="523" y="232" text-anchor="middle">3</text>
  <circle class="num" cx="520" cy="358" r="9"/><text class="numt" x="520" y="362" text-anchor="middle">4</text>
  <circle class="num" cx="720" cy="430" r="9"/><text class="numt" x="720" y="434" text-anchor="middle">5</text>
  <circle class="num" cx="830" cy="410" r="9"/><text class="numt" x="830" y="414" text-anchor="middle">6</text>
  <circle class="num" cx="740" cy="706" r="9"/><text class="numt" x="740" y="710" text-anchor="middle">7</text>
  <circle class="num" cx="940" cy="760" r="9"/><text class="numt" x="940" y="764" text-anchor="middle">8</text>
</svg>
