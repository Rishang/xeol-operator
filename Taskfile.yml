version: "3"

vars:
  IMG: '{{.IMG | default "xeol-operator:dev"}}'
  # Never rely on the current kube context; prod contexts share this kubeconfig.
  KUBE_CONTEXT: '{{.KUBE_CONTEXT | default "k3d-k3s-default"}}'
  K3D_CLUSTER: '{{.K3D_CLUSTER | default "k3s-default"}}'
  E2E_CLUSTER: '{{.E2E_CLUSTER | default "xeol-e2e"}}'
  CHART: helm/xeol-operator
  NS: xeol-system
  LOCALBIN: '{{.ROOT_DIR}}/bin'
  CONTROLLER_GEN: '{{.LOCALBIN}}/controller-gen'
  ENVTEST: '{{.LOCALBIN}}/setup-envtest'
  GOLANGCI_LINT: '{{.LOCALBIN}}/golangci-lint'
  CONTROLLER_TOOLS_VERSION: v0.23.0
  GOLANGCI_LINT_VERSION: v2.15.0
  ENVTEST_VERSION:
    sh: go list -m sigs.k8s.io/controller-runtime | cut -d' ' -f2
  ENVTEST_K8S_VERSION:
    sh: go list -m k8s.io/api | sed -E 's/.* v?[0-9]+\.([0-9]+).*/1.\1/'

tasks:
  manifests:
    desc: Generate RBAC manifests (config/rbac/role.yaml) from the +kubebuilder:rbac markers
    deps: [tools]
    cmds:
      - '{{.CONTROLLER_GEN}} rbac:roleName=manager-role paths="{./internal/...,./cmd/...}"'

  check:
    internal: true
    run: once
    deps: [manifests]
    cmds: [go fmt ./..., go vet ./...]

  test:
    desc: Unit and envtest tests
    deps: [check]
    cmds:
      - KUBEBUILDER_ASSETS="$({{.ENVTEST}} use {{.ENVTEST_K8S_VERSION}} --bin-dir {{.LOCALBIN}} -p path)" go test ./... -coverprofile cover.out

  test-trivy:
    desc: 'trivy parser test against a real trivy DB: task test-trivy TRIVY_DB_DIR=<dir holding db/trivy.db>'
    requires: {vars: [TRIVY_DB_DIR]}
    cmds:
      - TRIVY_DB_DIR={{.TRIVY_DB_DIR}} go test -tags trivy ./internal/scanner/

  test-e2e:
    desc: 'Smoke test in a throwaway k3d cluster: the Helm chart installs under restricted PSA and the pod turns Ready (EOL DB built)'
    deps: [docker-build]
    vars:
      # own kubeconfig: never touches ~/.kube/config or its current context
      KUBECONFIG: '{{.LOCALBIN}}/e2e.kubeconfig'
      CTX: k3d-{{.E2E_CLUSTER}}
    cmds:
      - k3d cluster create {{.E2E_CLUSTER}} --no-lb --k3s-arg '--disable=traefik@server:0' --kubeconfig-update-default=false --wait
      - defer: k3d cluster delete {{.E2E_CLUSTER}}
      - k3d kubeconfig get {{.E2E_CLUSTER}} > {{.KUBECONFIG}}
      - k3d image import {{.IMG}} -c {{.E2E_CLUSTER}}
      - kubectl --kubeconfig {{.KUBECONFIG}} --context {{.CTX}} create ns {{.NS}}
      - kubectl --kubeconfig {{.KUBECONFIG}} --context {{.CTX}} label ns {{.NS}} pod-security.kubernetes.io/enforce=restricted
      - >-
        helm install xeol-operator {{.CHART}} --kubeconfig {{.KUBECONFIG}} --kube-context {{.CTX}} -n {{.NS}} --wait --timeout 5m
        --set image.repository={{splitList ":" .IMG | first}} --set image.tag={{splitList ":" .IMG | last}}
        || { kubectl --kubeconfig {{.KUBECONFIG}} --context {{.CTX}} -n {{.NS}} get events;
        kubectl --kubeconfig {{.KUBECONFIG}} --context {{.CTX}} -n {{.NS}} logs deploy/xeol-operator --tail=50; exit 1; }

  lint:
    desc: golangci-lint
    deps: [tools]
    cmds:
      - '{{.GOLANGCI_LINT}} config verify'
      - '{{.GOLANGCI_LINT}} run {{.CLI_ARGS}}'

  tools:
    desc: Install pinned dev tools into bin/
    run: once
    cmds:
      - task: go-install
        vars: {NAME: controller-gen, BIN: '{{.CONTROLLER_GEN}}', PKG: sigs.k8s.io/controller-tools/cmd/controller-gen, VER: '{{.CONTROLLER_TOOLS_VERSION}}'}
      - task: go-install
        vars: {NAME: setup-envtest, BIN: '{{.ENVTEST}}', PKG: sigs.k8s.io/controller-runtime/tools/setup-envtest, VER: '{{.ENVTEST_VERSION}}'}
      - task: go-install
        vars: {NAME: golangci-lint, BIN: '{{.GOLANGCI_LINT}}', PKG: github.com/golangci/golangci-lint/v2/cmd/golangci-lint, VER: '{{.GOLANGCI_LINT_VERSION}}'}

  go-install:
    internal: true
    # versioned binary + symlink: a version bump reinstalls
    status: ['[ "$(readlink {{.BIN}})" = "{{.BIN}}-{{.VER}}" ]']
    cmds:
      - mkdir -p {{.LOCALBIN}}
      - '[ -f {{.BIN}}-{{.VER}} ] || { GOBIN={{.LOCALBIN}} go install {{.PKG}}@{{.VER}} && mv {{.LOCALBIN}}/{{.NAME}} {{.BIN}}-{{.VER}}; }'
      - ln -sf {{.BIN}}-{{.VER}} {{.BIN}}

  run:
    desc: Run the operator locally against the k3d cluster
    cmds:
      # minified kubeconfig holding only the test context, so the operator can't reach anything else
      - mkdir -p {{.LOCALBIN}} && kubectl config view --minify --flatten --context {{.KUBE_CONTEXT}} > bin/test.kubeconfig
      - go run ./cmd --kubeconfig bin/test.kubeconfig --metrics-bind-address :8080 --metrics-secure=false {{.CLI_ARGS}}

  docker-build:
    desc: Build the operator image
    cmds: ['docker build -t {{.IMG}} .']

  cluster-up:
    desc: 'Local k3d test cluster from scratch (idempotent): kube-prometheus-stack, EOL test apps, operator'
    cmds:
      - k3d cluster list {{.K3D_CLUSTER}} >/dev/null 2>&1 || k3d cluster create {{.K3D_CLUSTER}} --kubeconfig-switch-context=false --wait
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - >-
        helm upgrade --install kube-prom-stack prometheus-community/kube-prometheus-stack --version 92.13.1
        --kube-context {{.KUBE_CONTEXT}} -n monitoring --create-namespace -f test/kube-prom-stack.values.yaml
        --set "grafana.ingress.hosts[0]=grafana.$(docker inspect -f '{{"{{"}}range .NetworkSettings.Networks{{"}}"}}{{"{{"}}.IPAddress{{"}}"}}{{"{{"}}end{{"}}"}}' k3d-{{.K3D_CLUSTER}}-server-0).nip.io"
      - kubectl --context {{.KUBE_CONTEXT}} apply -f test/apps.yaml
      - task: deploy-dev
        vars: {CLI_ARGS: -f test/dev-values.yaml}

  deploy-dev:
    desc: Build the image, load it into k3d and install with Helm
    deps: [docker-build]
    cmds:
      - k3d image import {{.IMG}} -c {{.K3D_CLUSTER}}
      # The tag stays the same, so the image ID goes into a pod annotation: helm rolls the pod out once
      # when the image or the values change, and not at all when neither did.
      - >-
        helm upgrade --install xeol-operator {{.CHART}} --kube-context {{.KUBE_CONTEXT}}
        -n {{.NS}} --create-namespace
        --set image.repository={{splitList ":" .IMG | first}} --set image.tag={{splitList ":" .IMG | last}}
        --set image.pullPolicy=Never
        --force-conflicts
        --set-string podAnnotations.image-id=$(docker image inspect -f '{{"{{.Id}}"}}' {{.IMG}} | cut -d: -f2 | cut -c1-12)
        {{.CLI_ARGS}}
      - kubectl --context {{.KUBE_CONTEXT}} -n {{.NS}} rollout status deploy/xeol-operator --timeout=300s

  build-db:
    desc: Build xeol's EOL database from endoflife.date into ./db
    cmds: ['go run ./cmd build-db --out {{.OUT | default "db"}}']

  docs-dev:
    desc: Serve the docs site (ui/) with live reload at http://localhost:4321/xeol-operator/
    dir: ui
    cmds: [pnpm install --frozen-lockfile, pnpm exec astro dev]

  docs-build:
    desc: Build the docs site into ui/dist; broken internal links fail the build
    dir: ui
    cmds: [pnpm install --frozen-lockfile, pnpm exec astro build]

  chart-test:
    desc: Lint the chart and render it with each feature toggle
    cmds:
      - helm lint {{.CHART}}
      - helm template t {{.CHART}} > /dev/null
      - helm template t {{.CHART}} --set serviceMonitor.enabled=true,prometheusRule.enabled=true,grafanaDatasource.enabled=true,ui.enabled=true,mcp.enabled=true > /dev/null
      - helm template t {{.CHART}} --set db.source=mounted,db.mounted.volume.persistentVolumeClaim.claimName=xeol-db > /dev/null
      - helm template t {{.CHART}} --set db.source=mounted,db.mounted.initContainer.image=registry.local/xeol-db:latest > /dev/null
      - helm template t {{.CHART}} --set-json 'scanner.ignoreProducts=[{"products":["perl"],"namespaces":["test"]}]' | grep -q 'ignoreProducts'
      # null (default) leaves workloadKinds out; [] must reach the file, where it means every kind
      - test "$(helm template t {{.CHART}} -s templates/configmap.yaml | grep -c workloadKinds)" = 0
      - helm template t {{.CHART}} -s templates/configmap.yaml --set-json 'scanner.workloadKinds=[]' | grep -A1 workloadKinds | grep -q '\[\]'
