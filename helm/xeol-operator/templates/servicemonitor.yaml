{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "xeol-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xeol-operator.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "xeol-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      # Our namespace label is the scanned workload's namespace; without this Prometheus overwrites it
      # with the operator's own namespace and renames ours to exported_namespace.
      honorLabels: true
{{- end }}
