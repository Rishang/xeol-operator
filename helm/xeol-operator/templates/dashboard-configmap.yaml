{{- if .Values.grafanaDatasource.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xeol-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xeol-operator.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.eol.enabled }}
  xeol.json: |-
{{ .Files.Get "dashboards/xeol.json" | indent 4 }}
  {{- end }}
  {{- if .Values.trivy.enabled }}
  xeol-trivy.json: |-
{{ .Files.Get "dashboards/xeol-trivy.json" | indent 4 }}
  {{- end }}
{{- end }}
