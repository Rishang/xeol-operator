apiVersion: v1
kind: Service
metadata:
  name: {{ include "xeol-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "xeol-operator.labels" . | nindent 4 }}
spec:
  selector: {{- include "xeol-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
