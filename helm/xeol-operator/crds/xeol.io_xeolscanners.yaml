---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: xeolscanners.xeol.io
spec:
  group: xeol.io
  names:
    kind: XeolScanner
    listKind: XeolScannerList
    plural: xeolscanners
    singular: xeolscanner
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.imagesScanned
      name: Images
      type: integer
    - jsonPath: .status.eolFindings
      name: EOL
      type: integer
    - jsonPath: .status.dbBuilt
      name: DB Built
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: XeolScanner is the Schema for the xeolscanners API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: spec configures scanning
            properties:
              excludeImages:
                description: |-
                  excludeImages are globs on the image as written in the Pod spec or its repository, e.g.
                  "registry.internal/*" ("*" matches any characters, "/" included; "?" one character).
                items:
                  type: string
                type: array
              excludeNamespaces:
                description: excludeNamespaces are namespace name globs to skip, e.g.
                  "kube-*". "*" matches any characters, "?" one.
                items:
                  type: string
                type: array
              ignoreProducts:
                description: ignoreProducts hides accepted findings from metrics,
                  the JSON API and status. Images are still scanned.
                items:
                  description: |-
                    IgnoreRule hides findings of some products, optionally only some cycles, namespaces or workloads.
                    A rule applies to a workload only when both namespaces and selector match; with neither it applies everywhere.
                  properties:
                    cycles:
                      description: cycles limits the rule to these release cycles,
                        e.g. "3.8". Empty means every cycle.
                      items:
                        type: string
                      type: array
                    namespaces:
                      description: namespaces limits the rule to namespace name globs,
                        e.g. "test". Empty means every namespace.
                      items:
                        type: string
                      type: array
                    products:
                      description: |-
                        products are endoflife.date product slugs (https://endoflife.date/<slug>, e.g. "nodejs") or display names
                        (e.g. "Node.js", "Gorilla Toolkit"). Case-insensitive.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    selector:
                      description: selector limits the rule to workloads (Deployment,
                        DaemonSet, ...; a bare Pod) whose own labels match.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - products
                  type: object
                type: array
              interval:
                default: 24h
                description: interval is how often each image digest is rescanned.
                type: string
              namespaceSelector:
                description: namespaceSelector limits scanning to namespaces with
                  matching labels. Empty selects all.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              workloadKinds:
                default:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                description: |-
                  workloadKinds are the top-level workload kinds to scan (a Pod's owner chain, e.g. Pod → ReplicaSet →
                  Deployment, Job → CronJob), matched exactly. Pods of other kinds (Prometheus, Alertmanager, a bare Pod) are
                  skipped. An explicit empty list scans every kind.
                items:
                  type: string
                type: array
              workloadLabels:
                description: workloadLabels are workload label keys copied onto metrics
                  as k8s_label_<key>, e.g. "team".
                items:
                  type: string
                type: array
            type: object
          status:
            description: status defines the observed state of XeolScanner
            properties:
              conditions:
                description: 'conditions: Ready (operator is scanning) and DBStale
                  (EOL database older than 30 days).'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dbBuilt:
                description: dbBuilt is when the EOL database in use was built.
                format: date-time
                type: string
              eolFindings:
                description: eolFindings is the number of EOL findings across running
                  images.
                format: int32
                type: integer
              imagesScanned:
                description: imagesScanned is the number of running image digests
                  with a scan result.
                format: int32
                type: integer
              lastSweepTime:
                description: lastSweepTime is when every known image last had a completed
                  scan.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
